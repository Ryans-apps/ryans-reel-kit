name: iOS Safari test
# Test-only. Runs Reel Kit in real Mobile Safari on a freshly erased iPhone Simulator and saves screenshots/logs.
# The app is the LIVE GitHub Pages build, proxied byte-for-byte to localhost so the same-origin harness can drive it.
# Lives on branch ci/ios-safari-test only; GitHub Pages serves main, so the live site is untouched.
on:
  workflow_dispatch:
  push:
    branches: [ci/ios-safari-test]
permissions:
  contents: read
env:
  LIVE_URL: https://ryans-apps.github.io/ryans-reel-kit/
jobs:
  ios-safari:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Confirm the live build
        run: |
          mkdir -p out
          curl -s "${LIVE_URL}sw.js?bust=$(date +%s)" | grep -o "core-v[0-9]*" | head -1 | tee out/live-sw-core.txt
          grep -q core-v7 out/live-sw-core.txt
      - name: Pick, erase and boot an iPhone simulator (fresh Safari, no old service worker)
        run: |
          xcodebuild -version; xcrun simctl list runtimes
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys,re
          d=json.load(sys.stdin)['devices']
          rts=sorted([k for k in d if 'iOS' in k], key=lambda k:[int(x) for x in re.findall(r'\d+',k)])
          for rt in reversed(rts):
              ph=[x for x in d[rt] if x['name'].startswith('iPhone') and 'Pro' in x['name'] and 'Max' not in x['name']] or [x for x in d[rt] if x['name'].startswith('iPhone')]
              if ph: print(ph[0]['udid']); sys.stderr.write(rt+' '+ph[0]['name']+'\n'); break
          ")
          echo "UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl shutdown "$UDID" 2>/dev/null || true; xcrun simctl erase "$UDID"
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl list devices booted > out/device.txt
      - name: Live site directly in Mobile Safari
        run: |
          xcrun simctl openurl booted "$LIVE_URL"
          sleep 30; xcrun simctl io booted screenshot out/live-01-first-load.png
          sleep 20; xcrun simctl io booted screenshot out/live-02-after-sw.png
      - name: Full feature run (import video, edit, export) on the live build in Mobile Safari
        run: |
          python3 ci/ios-safari/server.py "$LIVE_URL" out > out/server.log 2>&1 &
          sleep 2
          xcrun simctl openurl booted "http://localhost:8123/ci/harness.html"
          for i in $(seq 1 150); do [ -f out/done ] && break; sleep 4; if [ $((i % 15)) -eq 0 ]; then xcrun simctl io booted screenshot out/progress-$i.png; fi; done
          xcrun simctl io booted screenshot out/zz-final.png
          cat out/results.jsonl || true
      - name: Summarize
        if: always()
        run: |
          python3 - <<'PY' | tee out/summary.txt
          import json
          for l in open('out/results.jsonl'):
              try: j = json.loads(l)
              except Exception: continue
              if 'step' in j: print(('PASS ' if j['ok'] else 'FAIL ') + j['step'] + '  ' + json.dumps(j.get('detail'))[:200])
          PY
          ! grep -q '^FAIL' out/summary.txt
      - name: Collect Safari logs
        if: always()
        run: xcrun simctl spawn booted log show --last 15m --style compact --predicate 'process == "MobileSafari" OR process CONTAINS "WebContent"' > out/safari-log.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ios-safari-results, path: out/ }
